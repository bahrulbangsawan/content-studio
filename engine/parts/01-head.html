<title>@@TITLE@@</title>
<!-- Font akun disematkan agar ekspor PNG dan MP4 memakai huruf yang sama -->
<style id="fontCss">@font-face { font-family: "@@FONT_FAMILY@@"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(data:font/woff2;base64,@@FONT_B64@@) format("woff2"); }</style>
<style id="brandCss">@@BRAND_CSS@@</style>
<style>
:root {
  /* Gaya studio: Zedative. Kertas hangat bergaris rambut. Bilah navigasi 56 px, lalu dua kolom yang dipisah satu garis
     vertikal: panggung carousel di atas kertas grafik, dan panel Pengaturan dan Panduan. Simpul belah ketupat di setiap
     perpotongan garis. Satu tema terang, sesuai sumber gaya. Slide memakai warna akun brand dari brand.json. */
  --bg: #f4f4f2;
  --bg-2: #fafafa;
  --fg: #000000;
  --ink: #393d45;
  --muted: #727a89;
  --accent: #1348dc;
  --accent-fg: #ffffff;
  --accent-deep: #053794;
  --border: #dadde2;
  --line: #cbcfd4;
  --pane: #ebebec;
  --pane-2: #dcdcdd;
  --shot: #2f343e;
  --danger: #b3261e;
  --field: color-mix(in srgb, var(--muted) 80%, var(--bg));
  --wash: color-mix(in srgb, var(--accent) 7%, transparent);
  --gridline: color-mix(in srgb, var(--muted) 6%, transparent);
  --lip: inset 0 -2px 0 0 color-mix(in srgb, var(--muted) 12%, transparent);
  --shadow: 0 20px 25px -5px color-mix(in srgb, var(--muted) 22%, transparent), 0 8px 10px -6px color-mix(in srgb, var(--muted) 22%, transparent);
  /* Warna garis bantu di atas slide: hanya alat, tidak pernah ikut terunduh */
  --g-red: #C8323A;
  --g-green: #0E7A3E;
  --font: "@@FONT_FAMILY@@", ui-sans-serif, system-ui, sans-serif;
  /* Gerak antarmuka studio */
  --z-ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* Nama sengaja beda dari --dur milik animasi slide */
  --z-dur: 150ms;
  /* Gerak isi slide (ikut ke video): tidak diubah oleh gaya studio */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
  --t: 1;
  --node: 7px;
  --grid: 16px;
  --panel-w: 440px;
  color-scheme: light;
}

/* ---------- Dasar ---------- */
* { box-sizing: border-box; }
[hidden]:not([hidden="until-found" i]) { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 13px; line-height: 20px; font-variation-settings: "opsz" 14; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
/* Butiran kertas: lapisan tetap di belakang isi, nyaris tak terlihat */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:where(button, a, input, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.node { width: var(--node); height: var(--node); border: 1px solid var(--line); background: var(--bg-2); transform: rotate(45deg); }
kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid color-mix(in srgb, var(--muted) 22%, transparent); border-radius: 2px; background: color-mix(in srgb, var(--bg-2) 50%, transparent); font: 400 11px/14px var(--font); color: var(--muted); }

/* ---------- Tombol ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px 0 10px;
  border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 4px;
  background: color-mix(in srgb, var(--bg-2) 60%, transparent); box-shadow: var(--lip); color: var(--fg);
  font: 400 13px/20px var(--font); white-space: nowrap; cursor: pointer;
  transition: background-color var(--z-dur) var(--z-ease), box-shadow var(--z-dur) var(--z-ease), transform var(--z-dur) var(--z-ease);
}
.btn:hover { background: color-mix(in srgb, var(--pane) 70%, transparent); box-shadow: none; }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; transform: none; }
.btn .ic { width: 14px; height: 14px; }
.btn.pri { border-color: transparent; background: var(--accent); color: var(--accent-fg); box-shadow: inset 0 -2px 0 0 var(--accent-deep), 0 1px 3px 0 color-mix(in srgb, var(--accent) 12%, transparent); }
.btn.pri:hover { background: color-mix(in srgb, var(--accent) 88%, var(--accent-deep)); box-shadow: none; }
.btn.pri kbd { color: color-mix(in srgb, var(--accent-fg) 85%, transparent); border-color: color-mix(in srgb, var(--accent-fg) 30%, transparent); background: color-mix(in srgb, var(--accent-fg) 10%, transparent); }
.btn.icon { width: 36px; padding: 0; }
.btn.icon .ic { width: 16px; height: 16px; }
.btn-sm { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; height: 32px; padding: 0 12px 0 10px; border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 4px; background: color-mix(in srgb, var(--bg-2) 60%, transparent); box-shadow: var(--lip); color: var(--fg); font: 400 13px/20px var(--font); white-space: nowrap; cursor: pointer; transition: background-color var(--z-dur) var(--z-ease), box-shadow var(--z-dur) var(--z-ease), transform var(--z-dur) var(--z-ease); }
.btn-sm:hover { background: color-mix(in srgb, var(--pane) 70%, transparent); box-shadow: none; }
.btn-sm:active { transform: translateY(1px) scale(0.99); }
.btn-sm .ic { width: 14px; height: 14px; }

/* ---------- Studio ---------- */
.studio { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr); }
.nav {
  position: relative; display: flex; align-items: center; gap: 12px; height: 56px; border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav > .node { display: none; position: absolute; z-index: 3; bottom: calc(var(--node) / -2 - 0.5px); right: calc(var(--panel-w) - var(--node) / 2 - 0.5px); }
.lockup { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lockup .logo-img { display: flex; flex: none; }
.lockup .logo-img svg { display: block; height: 24px; width: auto; max-width: 96px; }
.lockup b { font-size: 16px; line-height: 22px; font-weight: 550; font-variation-settings: "opsz" 18; color: var(--fg); }
.lockup span { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .spacer { flex: 1; }
@media (min-width: 1024px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  .studio { height: 100%; grid-template-columns: minmax(0, 1fr) var(--panel-w); grid-template-rows: 56px minmax(0, 1fr); }
  .nav { grid-column: 1 / -1; }
  .nav > .node { display: block; }
  .studio.is-focus { grid-template-columns: minmax(0, 1fr); }
  .studio.is-focus .panel, .studio.is-focus .nav > .node { display: none; }
}
@media (min-width: 1360px) { :root { --panel-w: 480px; } }

/* ---------- Panggung di atas kertas grafik ---------- */
.viewer {
  position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: var(--grid) var(--grid);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.stage-wrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; --frame: 48px; }
.stage-box { position: relative; aspect-ratio: 4 / 5; max-width: 100%; width: min(100cqw - 2 * var(--frame), (100cqh - 2 * var(--frame)) * 0.8); }
/* Garis rel memanjang dari tepi slide sampai tepi area, seperti tanda potong di kertas gambar */
.stage-box::before { content: ""; position: absolute; z-index: 0; left: -200vw; right: -200vw; top: -1px; bottom: -1px; border-block: 1px solid var(--line); pointer-events: none; }
.stage-box::after { content: ""; position: absolute; z-index: 0; top: -200vh; bottom: -200vh; left: -1px; right: -1px; border-inline: 1px solid var(--line); pointer-events: none; }
.stage-box > .node { position: absolute; z-index: 3; }
.n-tl { left: calc(var(--node) / -2 - 0.5px); top: calc(var(--node) / -2 - 0.5px); }
.n-tr { right: calc(var(--node) / -2 - 0.5px); top: calc(var(--node) / -2 - 0.5px); }
.n-bl { left: calc(var(--node) / -2 - 0.5px); bottom: calc(var(--node) / -2 - 0.5px); }
.n-br { right: calc(var(--node) / -2 - 0.5px); bottom: calc(var(--node) / -2 - 0.5px); }
.stage-tab { position: absolute; z-index: 2; left: 12px; bottom: calc(100% + 1px); display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-bottom: 0; border-radius: 4px 4px 0 0; background: var(--bg-2); font-size: 12px; line-height: 16px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stage-tab b { color: var(--fg); font-weight: 550; font-variation-settings: "opsz" 18; transition: opacity var(--z-dur) var(--z-ease); }
.stage-tab b.swap-out { opacity: 0; }
.auto-bar { position: absolute; z-index: 2; left: 0; right: 0; top: calc(100% + 1px); height: 2px; background: var(--ink); transform-origin: left center; transform: scaleX(0); }
.stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; background: var(--pane); box-shadow: var(--shadow); touch-action: pan-y; cursor: grab; isolation: isolate; --k: 0.5; }
.stage::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 10%, transparent); pointer-events: none; z-index: 3; }
.stage.dragging { cursor: grabbing; }
.stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
.track { display: flex; height: 100%; transition: transform calc(520ms * var(--t)) var(--ease); }
.dragging .track, .track.no-anim, .is-static .track { transition: none; }
.slide { flex: 0 0 100%; height: 100%; position: relative; overflow: hidden; background: var(--s-bg); }
.snap, .snap * { transition: none !important; }

/* ---------- Bilah kontrol ---------- */
.dock { position: relative; z-index: 2; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 12px 0 16px; }
.dock-group { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-2); box-shadow: var(--lip); }
.ibtn { position: relative; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--fg); cursor: pointer; transition: background-color var(--z-dur) var(--z-ease), transform var(--z-dur) var(--z-ease); }
.ibtn:hover { background: var(--pane); }
.ibtn:active { transform: translateY(1px) scale(0.99); }
.ibtn:disabled { opacity: 0.4; cursor: default; background: transparent; transform: none; }
.ibtn[aria-pressed="true"] { background: var(--pane-2); }
.ibtn .ic { width: 16px; height: 16px; }
.swap { position: relative; width: 16px; height: 16px; display: block; }
.swap .ic { position: absolute; inset: 0; transition-property: opacity, scale, filter; transition-duration: var(--z-dur); transition-timing-function: var(--z-ease); }
.swap .ic.b, [aria-pressed="true"] > .swap .ic.a { opacity: 0; scale: 0.25; filter: blur(4px); }
[aria-pressed="true"] > .swap .ic.b { opacity: 1; scale: 1; filter: blur(0px); }
.dots { display: flex; align-items: center; padding: 0 4px; }
.cv-n { min-width: 72px; padding: 0 6px; font-size: 12px; line-height: 16px; text-align: center; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot { width: 24px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; cursor: pointer; }
.dot i { display: block; width: 7px; height: 7px; border: 1px solid var(--muted); background: var(--bg-2); transform: rotate(45deg); transition: background-color var(--z-dur) var(--z-ease), border-color var(--z-dur) var(--z-ease), transform var(--z-dur) var(--z-ease); }
.dot:hover i { border-color: var(--fg); }
.dot[aria-current="true"] i { background: var(--fg); border-color: var(--fg); transform: rotate(45deg) scale(1.3); }
.dot b { display: none; }
</style>
