<div class="studio" id="studio">
  <header class="nav">
      <div class="lockup">@@NAV_LOCKUP@@<span>Studio carousel</span></div>
      <span class="spacer"></span>
      <div class="dl" id="dl" hidden>
        <button type="button" class="btn pri" id="btnDl" aria-expanded="false" aria-controls="dlPop" aria-keyshortcuts="D"><svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>Unduh<kbd aria-hidden="true">D</kbd></button>
        <div class="dl-pop" id="dlPop" role="dialog" aria-label="Unduh carousel" hidden>
          <span class="dl-h">Gambar PNG, 1080 x 1350</span>
          <button type="button" class="dl-item" data-x="png-one"><span class="ic-box"><svg class="ic" aria-hidden="true"><use href="#i-photo"/></svg></span><span><b>Slide ini</b><small id="dlOneName">Slide 1, Cover</small></span></button>
          <button type="button" class="dl-item" data-x="png-all"><span class="ic-box"><svg class="ic" aria-hidden="true"><use href="#i-zip"/></svg></span><span><b>Semua slide</b><small>6 gambar dalam satu file .zip</small></span></button>
          <div class="dl-sep" role="presentation"></div>
          <span class="dl-h" id="dlVidHead">Video MP4, 30 fps</span>
          <button type="button" class="dl-item dl-vid" data-x="mp4-one"><span class="ic-box"><svg class="ic" aria-hidden="true"><use href="#i-movie"/></svg></span><span><b>Animasi slide ini</b><small id="dlOneDur">3,6 dtk</small></span></button>
          <button type="button" class="dl-item dl-vid" data-x="mp4-zip"><span class="ic-box"><svg class="ic" aria-hidden="true"><use href="#i-zip"/></svg></span><span><b>Setiap slide terpisah</b><small id="dlEachDur">6 video dalam satu file .zip</small></span></button>
          <button type="button" class="dl-item dl-vid" data-x="mp4-all"><span class="ic-box"><svg class="ic" aria-hidden="true"><use href="#i-movie"/></svg></span><span><b>Semua slide berurutan</b><small id="dlAllDur">20,4 dtk dengan transisi geser</small></span></button>
          <div class="dl-status" id="dlStatus" hidden>
            <div class="dl-row"><span id="dlMsg" aria-live="polite">Menyiapkan</span><button type="button" class="btn-sm" id="dlCancel">Batal</button></div>
            <div class="dl-bar" aria-hidden="true"><i id="dlBar"></i></div>
          </div>
          <p class="dl-note" id="dlNote" role="status" hidden></p>
        </div>
      </div>
      <button type="button" class="btn icon" id="btnFocus" aria-pressed="false" aria-label="Sembunyikan panel">
        <span class="swap"><svg class="ic a"><use href="#i-collapse"/></svg><svg class="ic b"><use href="#i-expand"/></svg></span>
      </button>
      <span class="node" aria-hidden="true"></span>
  </header>

  <main class="viewer" aria-label="Pratinjau carousel">

    <div class="stage-wrap">
      <div class="stage-box" id="stageBox">
        <span class="node n-tl" aria-hidden="true"></span><span class="node n-tr" aria-hidden="true"></span><span class="node n-bl" aria-hidden="true"></span><span class="node n-br" aria-hidden="true"></span>
        <div class="stage-tab" aria-hidden="true"><span id="nowN">1/6</span><b id="nowName">Cover</b></div>
        <i class="auto-bar" id="autoBar" aria-hidden="true"></i>
        <div class="stage" id="stage" tabindex="0" role="region" aria-roledescription="carousel" aria-label="@@STAGE_LABEL@@">
          <div class="track" id="track">
