<style id="reelCss">
/* ================= Reels 1080 x 1920 (warna dari akun, tidak ikut tema studio) =================
   Zona aman video datang dari videoRules akun lewat variabel di .rf (zoneCss di reel-render.mjs). Bawaannya:
   header y 0-220 (logo dan handle), samping 35, kolom tombol 100 px di kanan dari y 1160, bawah dari y 1470.
   Adegan mengisi x 60-1020, y 220-1144 (di atas kolom tombol, di tengah), dengan skala --zoom dari ukuran
   rancangan minimal 800 x 940. Subtitle menempel di batas bawah zona aman; catatan kaki penutup di atasnya.
   Hanya token warna akun (--s-*, --l-*). Teks tidak pernah langsung di atas footage: selalu di kartu padat. */
.rf { --cz-x: 60px; --cz-y: 220px; --cz-w: 960px; --cz-h: 924px; --zoom: 0.983; --cap-x: 135px; --cap-y: 1320px; --cap-w: 810px; --cap-h: 150px; --ft-x: 135px; --ft-y: 1160px; --ft-w: 810px; --ft-h: 310px; --hdr-h: 220px; --hdr-x: 60px; }
.rf { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; transform: scale(var(--k, 0.3)); font-family: var(--font); background: var(--s-bg, #000); isolation: isolate; }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--s-bg); color: var(--s-ink); }
.scene[hidden] { display: none; }
.scene * { box-sizing: border-box; }
.cz { position: absolute; left: var(--cz-x); top: var(--cz-y); width: calc(var(--cz-w) / var(--zoom)); height: calc(var(--cz-h) / var(--zoom)); transform-origin: 0 0;
  /* Camera (--cam-*, set by the player while the scene plays) moves the content around the middle of its zone */
  transform: translate(var(--cam-x, 0px), var(--cam-y, 0px)) translate(calc(var(--cz-w) / 2), calc(var(--cz-h) / 2)) scale(var(--cam-s, 1)) translate(calc(var(--cz-w) / -2), calc(var(--cz-h) / -2)) scale(var(--zoom)); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 36px; overflow-wrap: anywhere; }
.cz > * { flex: none; max-width: 100%; }
.cz p, .cz h1, .cz h2, .cz blockquote, .cz ul, .cz ol { margin: 0; }
.cz ul, .cz ol { padding: 0; list-style: none; }

/* ---------- Latar bergerak: bentuk lembut warna akun di belakang isi, pelan dan samar ---------- */
.bd { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bd > i { position: absolute; display: block; }
.bd-blob > i { width: 900px; height: 900px; border-radius: 50%; }
.bd-blob > i:nth-child(1) { left: -380px; top: 60px; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-sun) 24%, transparent), transparent); }
.bd-blob > i:nth-child(2) { right: -420px; top: 760px; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-joint) 22%, transparent), transparent); }
.bd-blob > i:nth-child(3) { left: 120px; bottom: -560px; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-sun) 16%, transparent), transparent); }
/* On light scenes the second shape stays warm: blue over cream turns grey */
.is-light .bd-blob > i:nth-child(2) { background: radial-gradient(closest-side, color-mix(in srgb, var(--s-sun) 15%, transparent), transparent); }
.bd-ring > i { border-radius: 50%; border: 4px dashed color-mix(in srgb, var(--s-ink) 11%, transparent); }
.bd-ring > i:nth-child(1) { width: 1300px; height: 1300px; left: 260px; top: -520px; }
.bd-ring > i:nth-child(2) { width: 900px; height: 900px; left: 460px; top: -320px; border-style: solid; border-color: color-mix(in srgb, var(--s-sun) 22%, transparent); border-width: 3px; }
.bd-ring > i:nth-child(3) { width: 1100px; height: 1100px; left: -560px; top: 1240px; }
.bd-dots > i:nth-child(1) { inset: -240px; background-image: radial-gradient(color-mix(in srgb, var(--s-ink) 12%, transparent) 3px, transparent 3.6px); background-size: 52px 52px; -webkit-mask-image: linear-gradient(160deg, #000, transparent 70%); mask-image: linear-gradient(160deg, #000, transparent 70%); }
.bd-dots > i:nth-child(2) { width: 760px; height: 760px; border-radius: 50%; right: -300px; bottom: -200px; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-sun) 20%, transparent), transparent); }
.bd-dots > i:nth-child(3) { display: none; }
/* Transisi warna: dua pita warna akun menyapu layar */
.tr-panel { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; background: transparent !important; }
.tr-panel[hidden] { display: none; }
.tr-panel > i { position: absolute; top: -10%; bottom: -10%; left: -20%; width: 140%; display: block; will-change: transform; }
.tr-panel > i:nth-child(1) { background: var(--l-joint); }
.tr-panel > i:nth-child(2) { background: var(--s-sun); }

/* ---------- Huruf ---------- */
.r-xl { font-size: 148px; line-height: 150px; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.r-h1 { font-size: 120px; line-height: 126px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.r-h2 { font-size: 92px; line-height: 100px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.r-h3 { font-size: 64px; line-height: 74px; font-weight: 700; letter-spacing: -0.01em; text-wrap: pretty; }
.r-head { font-size: 72px; line-height: 80px; font-weight: 700; letter-spacing: -0.012em; text-wrap: balance; }
.r-xl.fit-1 { font-size: 120px; line-height: 126px; } .r-xl.fit-2 { font-size: 104px; line-height: 110px; }
.r-h1.fit-1 { font-size: 104px; line-height: 110px; } .r-h1.fit-2 { font-size: 92px; line-height: 100px; }
.r-h2.fit-1 { font-size: 84px; line-height: 92px; } .r-h2.fit-2 { font-size: 72px; line-height: 80px; }
.r-head.fit-1 { font-size: 64px; line-height: 74px; } .r-head.fit-2 { font-size: 60px; line-height: 70px; }
.r-lede { font-size: 56px; line-height: 72px; font-weight: 500; text-wrap: pretty; }
.r-body { font-size: 48px; line-height: 64px; font-weight: 400; color: var(--s-muted); text-wrap: pretty; }
.r-kick { font-size: 44px; line-height: 54px; font-weight: 600; color: var(--s-muted); text-wrap: balance; }
.r-meta { font-size: 36px; line-height: 48px; color: var(--s-muted); }
.w { display: inline-block; }
.r-num { font-size: 300px; line-height: 280px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--s-ink); white-space: nowrap; }
.r-num-m { font-size: 180px; line-height: 176px; }
.r-num.sz-2 { font-size: 220px; line-height: 210px; } .r-num.sz-3 { font-size: 168px; line-height: 168px; }
.r-num-m.sz-2, .r-num-m.sz-3 { font-size: 140px; line-height: 140px; }
.r-num-row { display: flex; align-items: baseline; justify-content: center; gap: 28px; }
.r-num-row .r-of { font-size: 72px; line-height: 80px; }
.r-num-row.r-num-m .r-num { font-size: 180px; line-height: 176px; }
.r-headrow { display: flex; align-items: center; gap: 32px; width: 100%; }
.r-headrow .r-head { flex: 1; min-width: 0; }
.r-headrow > .r-ill { width: 180px; height: 180px; }

/* Penanda: warna sorotan di belakang kata kunci, menyapu dari kiri; teksnya berganti warna saat tersorot */
.mk { background-image: linear-gradient(var(--s-sun), var(--s-sun)); background-repeat: no-repeat; background-size: 0% 100%; background-position: 0 55%; padding: 0 0.1em; margin: 0 -0.1em; border-radius: 0.14em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.mk.is-on .w { color: var(--s-face); }
/* Coretan per kata, supaya tetap benar saat kalimatnya terbagi baris */
.sw { position: relative; }
.sw-l { position: absolute; left: -0.06em; right: -0.06em; top: 48%; width: calc(100% + 0.12em); height: 0.2em; overflow: visible; }
.sw-l path { fill: none; stroke: var(--s-sun); stroke-width: 9; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: 1; }
.mk-x.is-on .w { color: var(--s-muted); }

/* ---------- Bagian kecil ---------- */
.r-chip { display: inline-flex; align-items: center; gap: 16px; height: 84px; padding: 0 36px 0 30px; border-radius: 999px; font-size: 40px; line-height: 48px; font-weight: 600; white-space: nowrap; }
.r-chip .ic { width: 44px; height: 44px; stroke-width: 2.2; }
.r-chip:not(:has(.ic)) { padding: 0 36px; }
.c-sun { background: var(--s-sun); color: var(--s-face); }
.c-joint { background: var(--s-joint); color: var(--s-bg); }
.c-card { background: var(--l-card); color: var(--l-ink); }
.r-card { background: var(--l-card); color: var(--l-ink); border-radius: 32px; padding: 52px 56px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--l-ink) 10%, transparent); }
.r-card .r-body, .r-card .r-meta { color: var(--l-muted); }
.r-badge { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.r-badge .ic { width: 52px; height: 52px; stroke-width: 2.6; }
.b-yes { background: var(--s-joint); color: var(--s-bg); }
.b-no, .b-warn { background: var(--s-sun); color: var(--s-face); }
.r-card .b-yes { background: var(--l-joint); color: var(--l-card); }
.r-src { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 32px; line-height: 40px; font-weight: 500; color: var(--s-muted); }
.r-card .r-src { color: var(--l-muted); }
.r-src.on-media { align-self: flex-start; padding: 12px 24px 12px 20px; border-radius: 20px; background: var(--l-card); color: var(--l-muted); }
.r-hook.v-question .r-src, .r-hook.v-number .r-src, .r-hook.v-myth .r-src, .r-stat .r-src, .r-def .r-src { align-self: center; }
.r-src .ic { width: 36px; height: 36px; stroke-width: 2; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.r-ill { flex: none; }
.r-ill-xl { width: 600px; height: 600px; } .r-ill-l { width: 460px; height: 460px; } .r-ill-m { width: 340px; height: 340px; } .r-ill-s { width: 230px; height: 230px; }
/* In a column the illustration takes what the text leaves, between 220 and its own size */
.cz > .r-ill-l, .cz > .r-ill-m { flex: 0 1 auto; height: auto; min-height: 180px; aspect-ratio: 1; width: auto; }
.cz > .r-ill-l { max-height: 460px; } .cz > .r-ill-m { max-height: 340px; }
.r-corner { position: absolute; top: 0; right: 0; }

/* ---------- Foto dan footage ---------- */
.md { position: relative; overflow: hidden; background: var(--s-rule); }
.md-el { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--fp, 50% 50%); transform-origin: var(--fp, 50% 50%); }
.md.is-missing { display: grid; place-items: center; }
.md-ph { width: 160px; height: 160px; fill: none; stroke: var(--s-muted); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.r-bg { position: absolute; inset: 0; }
.md-full { position: absolute; inset: 0; }
.md-top { width: 100%; height: 520px; border-radius: 32px; }
.md-frame { width: 100%; flex: 1 1 auto !important; min-height: 480px; border-radius: 32px; }
.r-plate { width: 100%; display: flex; flex-direction: column; gap: 20px; }
.r-plate .r-kick { color: var(--l-muted); }

/* ---------- Pembuka ---------- */
.r-hook.v-question, .r-hook.v-number, .r-hook.v-myth { align-items: center; text-align: center; }
.r-hook.v-number .r-h2 { font-size: 64px; line-height: 74px; }

.r-hook.v-footage .r-h1.fit-1 { font-size: 84px; line-height: 92px; } .r-hook.v-footage .r-h1.fit-2 { font-size: 72px; line-height: 80px; }
.r-hook.v-split .r-h1 { font-size: 92px; line-height: 100px; }
.r-hook.v-split .r-h1.fit-1 { font-size: 84px; line-height: 92px; } .r-hook.v-split .r-h1.fit-2 { font-size: 72px; line-height: 80px; }
.r-hook.v-bold { gap: 40px; }
.r-hook.v-myth { gap: 24px; }
.r-hook.v-myth .r-stamp { font-size: 64px; line-height: 76px; }
.r-hook.v-myth > .r-ill-m { min-height: 110px; }

.r-hook.v-bold .r-corner { position: static; align-self: flex-start; order: -1; width: 300px; height: 300px; }
.r-stamp { display: inline-block; margin-top: -12px; padding: 6px 34px; border: 7px solid var(--s-sun); border-radius: 18px; color: var(--s-sun); font-size: 72px; line-height: 84px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; transform: rotate(-6deg); }

/* ---------- Penjelasan ---------- */
.r-st.v-plain .r-body { max-width: 820px; }
.r-st.v-card { justify-content: center; }
.r-card-ill { position: relative; width: 100%; display: flex; flex-direction: column; gap: 22px; padding-top: 160px; margin-top: 120px; }
.r-onedge { position: absolute; top: -120px; left: 56px; width: 260px !important; height: 260px !important; }
.r-card-ill .r-h3 { font-size: 60px; line-height: 70px; }
.r-qrow { display: flex; align-items: flex-start; justify-content: space-between; width: 100%; }
.r-qrow > .r-ill { width: 200px; height: 200px; }
.r-st.v-quote .r-qm { font-size: 240px; line-height: 150px; font-weight: 700; color: var(--s-sun); height: 150px; overflow: visible; }
.r-st.v-quote .r-h2 { font-size: 84px; line-height: 92px; }
.r-by { font-size: 40px; line-height: 50px; font-weight: 600; color: var(--s-muted); }

/* ---------- Angka ---------- */
.r-stat { align-items: center; text-align: center; gap: 30px; }
.r-stat .r-head { font-size: 64px; line-height: 74px; }
.r-stat .r-head { align-self: stretch; }
.r-ring { position: relative; width: 560px; height: 560px; display: grid; place-items: center; }
.r-head ~ .r-ring { width: 420px; height: 420px; }
.r-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.r-ring-t, .r-ring-p { fill: none; stroke-width: 44; }
.r-ring-t { stroke: var(--s-rule); }
.r-ring-p { stroke: var(--s-sun); stroke-linecap: round; }
.r-num-ring { font-size: 180px; line-height: 180px; }
.r-head ~ .r-ring .r-num-ring { font-size: 140px; line-height: 140px; }
.r-stat .r-lede { max-width: 860px; font-size: 54px; line-height: 66px; }
.r-stat .r-head ~ .r-num { font-size: 220px; line-height: 210px; }
.r-stat.v-bar { align-items: stretch; text-align: left; }
.r-bars { display: flex; flex-direction: column; gap: 26px; }
.r-bar { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 76px; column-gap: 24px; row-gap: 12px; align-items: center; }
.r-bar-l { grid-column: 1 / -1; font-size: 44px; line-height: 52px; font-weight: 600; }
.r-bar-track { height: 76px; border-radius: 38px; background: var(--s-rule); overflow: hidden; }
.r-bar-fill { display: block; height: 100%; border-radius: 38px; background: var(--s-joint); transform-origin: 0 50%; }
.r-bar.is-focus .r-bar-fill { background: var(--s-sun); }
.r-bar-v { font-size: 64px; line-height: 76px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 180px; text-align: right; }
.r-stat.v-bar .r-corner { top: 0; }
.r-num-row { display: flex; align-items: baseline; gap: 28px; }
.r-of { font-size: 64px; line-height: 72px; font-weight: 600; color: var(--s-muted); }
.r-people { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 28px; }
.r-p { width: 132px; height: 132px; display: grid; place-items: center; border-radius: 50%; background: var(--s-rule); color: var(--s-muted); }
.r-p .ic { width: 86px; height: 86px; stroke-width: 1.8; }
.r-p.is-on { background: var(--s-sun); color: var(--s-face); }
.r-people.n20 .r-p { width: 108px; height: 108px; } .r-people.n20 .r-p .ic { width: 64px; height: 64px; }
.r-people.n20 { gap: 16px 24px; }
.r-stat.v-people { gap: 36px; }

/* ---------- Langkah ---------- */
.r-steps { gap: 26px; }
.r-path { display: flex; flex-direction: column; gap: 30px; width: 100%; }
.r-step { position: relative; display: grid; grid-template-columns: 96px 1fr; column-gap: 36px; align-items: start; }
.r-node { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--s-joint); color: var(--s-bg); font-size: 48px; line-height: 56px; font-weight: 700; position: relative; z-index: 1; }
.r-node.is-on { background: var(--s-sun); color: var(--s-face); }
.r-st-t { font-size: 56px; line-height: 64px; font-weight: 700; padding-top: 16px; }
.r-st-d { font-size: 40px; line-height: 52px; color: var(--s-muted); margin-top: 8px; }
.r-link { position: absolute; left: 44px; top: 96px; width: 8px; height: calc(100% - 96px + 30px); overflow: visible; }
.r-link path, .r-tl-line path { fill: none; stroke: var(--s-joint); stroke-width: 8; stroke-dasharray: 1; vector-effect: non-scaling-stroke; }
.r-steps.n4 .r-st-t { font-size: 52px; line-height: 60px; padding-top: 18px; } .r-steps.n4 .r-st-d { font-size: 40px; line-height: 48px; }
.r-steps.n5 .r-st-t { font-size: 48px; line-height: 56px; padding-top: 20px; } .r-steps.n5 .r-st-d { display: none; }
.r-steps.n5 .r-path { gap: 22px; }
.r-stack { display: flex; flex-direction: column; gap: 24px; width: 100%; }
.r-scard { display: flex; gap: 32px; align-items: flex-start; padding: 36px 44px; }
.r-scard .r-n { flex: none; width: 88px; height: 88px; border-radius: 24px; display: grid; place-items: center; background: var(--l-joint); color: var(--l-card); font-size: 48px; line-height: 56px; font-weight: 700; }
.r-scard .r-st-t { padding-top: 12px; }
.r-scard .r-st-d { color: var(--l-muted); }
.r-steps.v-cards.n4 .r-scard, .r-steps.v-cards.n5 .r-scard { padding: 20px 32px; gap: 24px; }
.r-steps.v-cards.n4 .r-st-t, .r-steps.v-cards.n5 .r-st-t { font-size: 44px; line-height: 52px; padding-top: 16px; }
.r-steps.v-cards.n4 .r-st-d { font-size: 40px; line-height: 48px; margin-top: 2px; }
.r-steps.v-cards .r-stack { gap: 16px; }
.r-steps.v-cards.n4 .r-scard .r-n, .r-steps.v-cards.n5 .r-scard .r-n { width: 80px; height: 80px; }

/* ---------- Daftar dan tanda bahaya ---------- */
.r-list, .r-flags { gap: 36px; }
.r-items { display: flex; flex-direction: column; gap: 28px; width: 100%; }
.r-li { display: flex; align-items: flex-start; gap: 32px; font-size: 52px; line-height: 64px; font-weight: 600; }
.r-li > span:last-child { padding-top: 12px; }
.r-bi { width: 88px; height: 88px; border-radius: 24px; display: grid; place-items: center; background: var(--s-joint); color: var(--s-bg); flex: none; }
.r-bi .ic { width: 52px; height: 52px; stroke-width: 2.2; }
.r-bd { width: 28px; height: 28px; border-radius: 50%; background: var(--s-sun); flex: none; margin: 30px 30px 0 30px; }
.r-list.n4 .r-li, .r-flags.n4 .r-li { font-size: 48px; line-height: 58px; }
.r-list.n5 .r-li { font-size: 44px; line-height: 54px; }
.r-list.n5 .r-items { gap: 22px; }
.r-flags .r-items { padding: 44px 48px; gap: 24px; }
.r-flags .r-li { font-size: 46px; line-height: 56px; }
.r-flags.n4 .r-li { font-size: 44px; line-height: 54px; }
.r-flags.n4 .r-items { gap: 18px; padding: 36px 44px; }
.r-flags .r-badge { width: 76px; height: 76px; } .r-flags .r-badge .ic { width: 44px; height: 44px; }
.r-flags .r-li > span:last-child { padding-top: 10px; }


/* ---------- Bandingkan ---------- */
.r-cmpz { gap: 22px; }
.r-pair { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
.r-cmp { position: relative; width: 100%; display: grid; grid-template-columns: 88px 1fr; column-gap: 32px; row-gap: 6px; padding: 34px 44px; }
.r-cmp .r-badge { grid-row: 1 / span 2; }
.r-cmp-l { font-size: 40px; line-height: 48px; font-weight: 600; color: var(--l-muted); padding-top: 4px; }
.r-cmp-t { font-size: 48px; line-height: 60px; font-weight: 700; }
.r-cmp:has(.r-cmp-ill) { padding-right: 250px; min-height: 280px; }
.r-cmp-ill { position: absolute; right: 36px; top: 50%; margin-top: -100px; width: 200px !important; height: 200px !important; }
.r-arrow { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; background: var(--s-joint); color: var(--s-bg); }
.r-arrow .ic { width: 48px; height: 48px; stroke-width: 2.4; }
.r-cmpz.v-cols .r-pair { flex-direction: row; align-items: stretch; gap: 24px; }
.r-cmpz.v-cols .r-cmp { display: flex; flex-direction: column; gap: 20px; padding: 40px 36px; min-height: 0; }
